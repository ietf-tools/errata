  /api/meeting/session/{id}/attendees/:
    post:
      operationId: meeting_session_add_attendees
      description: |-
        Records an Attended row per attendee. An attendee already recorded for the session keeps their existing join time.

        Each attendee is identified by any UUID the datatracker has issued them, so a UUID superseded by a merge still resolves. If any UUID fails to resolve the whole request is rejected and nothing is recorded.

        join_time must carry an explicit UTC offset.

        For an interim meeting this also regenerates the session's bluesheet.
      summary: Record attendees for a session
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
