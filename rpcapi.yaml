  /api/person/uuid/{uuid}/:
    get:
      operationId: person_uuid_retrieve
      description: |-
        Resolve any UUID the datatracker has issued for a Person to that Person's current identifier set. A UUID that stopped being primary because of a merge still resolves, and the response carries the current primary. A 200 whose primary_uuid differs from the requested uuid means "same person, new identifier" - it is not an error.

        A 404 means no Person has this UUID. It does not distinguish a UUID the datatracker never issued from one it issued to a Person that has since been deleted, because deleting a Person deletes its UUIDs.

        primary_uuid is the person's current primary. Re-read it; do not assume it is unchanged from a previous response, and do not assume a UUID you hold remains primary.

        Responses contain identifiers only. No name, address or database key is returned.
      summary: Resolve a Person UUID
      parameters:
      - in: path
        name: uuid
        schema:
          type: string
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
        required: true
      tags:
      - person
      security:
      - apiKeyAuth: []
      - cookieAuth: []
      responses:
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonUuidRetrieveErrorResponse400'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse404'
              examples:
                NotFound:
                  value:
                    type: client_error
                    errors:
                    - code: not_found
                      detail: Not found.
                      attr: null
          description: ''
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonUUIDResolution'
          description: ''
  /api/person/uuid/by-person-pk/:
    post:
      operationId: person_uuid_by_person_pk
      description: |-
        DEPRECATED FROM FIRST RELEASE, AND WILL BE WITHDRAWN. Resolves up to 500 Person.pk values to their UUID sets, so an application that keyed its records on the datatracker database key can convert them to UUIDs once and stop using the key. Person.pk is the identifier this whole feature exists to stop exporting: it does not survive a Person merge, which is why holding it is unsafe.

        Intended to be called once per consuming application, to migrate a table. Do not call it at request time and do not build anything that keeps needing it.

        One results entry per distinct requested pk, with the same fields either way and the identifier fields null when status is unknown. Switch on status.
      summary: 'TRANSITIONAL: resolve Person database keys to UUIDs'
      tags:
      - person
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PersonPkBatchRequestRequest'
        required: true
      security:
      - apiKeyAuth: []
      - cookieAuth: []
      deprecated: true
      responses:
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonUuidByPersonPkErrorResponse400'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse404'
              examples:
                NotFound:
                  value:
                    type: client_error
                    errors:
                    - code: not_found
                      detail: Not found.
                      attr: null
          description: ''
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonPkBatchResponse'
              examples:
                TwoPks,OneOfThemUnknown:
                  value:
                    results:
                    - person_pk: 12345
                      status: resolved
                      primary_uuid: 6f9a1c30-6c7e-4f0a-9a3f-2f1d0b8a4e11
                      prior_uuids:
                      - 0b21f8d4-1a55-4c9e-8f77-9c2b4a6e3d02
                    - person_pk: 999999
                      status: unknown
                      primary_uuid: null
                      prior_uuids: []
                  summary: Two pks, one of them unknown
          description: ''
  /api/person/uuid/lookup/:
    post:
      operationId: person_uuid_lookup
      description: |-
        Resolve up to 500 UUIDs in one call. Always returns 200 with one results entry per distinct requested UUID - no entry is ever omitted and no unresolvable UUID fails the request.

        Each entry carries a status of resolved or unknown, corresponding to the 200 and 404 outcomes of the single-UUID endpoint. Every entry has the same fields either way, with the identifier fields null when status is unknown, so switch on status rather than on which fields are present. Duplicate inputs produce one entry. Entry order is not significant - match on uuid.
      summary: Resolve a batch of Person UUIDs
      tags:
      - person
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PersonUUIDBatchRequestRequest'
        required: true
      security:
      - apiKeyAuth: []
      - cookieAuth: []
      responses:
