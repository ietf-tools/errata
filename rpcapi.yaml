openapi: 3.0.3
info:
  title: Datatracker API
  version: 1.0.0
  description: Datatracker API
paths:
  /api/accounts/migration/claim-email/:
    post:
      operationId: account_migration_claim_email
      description: |-
        Make an address usable by the Person enrolling, whether it is new to the datatracker, already theirs, or theirs but inactive. Idempotent: calling it again with the same arguments succeeds and changes nothing.

        person_uuid may be any UUID the datatracker has issued for the Person, not only the current primary.

        Every refusal is a 400, told apart by its error code, because each one is about the data supplied rather than the state of a resource. address_belongs_to_another_person means the address is someone else's; it is never moved, so offer another address or send the person to support, who may find the two Persons should be merged. address_has_no_owner means the datatracker knows the address but has never established who is behind it - support establishes that, not enrollment. unknown_person_uuid means no Person has that UUID, and does not distinguish one never issued from one whose Person has since been deleted.

        The response describes the address as it now stands. It does not make the address primary - which address is primary is the person's own profile choice and is not changed here.
      summary: Give a Person an address, or reactivate one it already has
      tags:
      - migration
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClaimEmailRequestRequest'
        required: true
      security:
      - apiKeyAuth: []
      - cookieAuth: []
      responses:
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountMigrationClaimEmailErrorResponse400'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse404'
              examples:
                NotFound:
                  value:
                    type: client_error
                    errors:
                    - code: not_found
                      detail: Not found.
                      attr: null
          description: ''
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MigrationEmail'
          description: ''
  /api/accounts/migration/verify/:
    post:
      operationId: account_migration_verify
      description: |-
        Validate a datatracker login and return the Person it belongs to, so the account app can offer that person's addresses and profile while it builds their new account.

        encrypted_password is the password encrypted to the datatracker's public key with RSA-OAEP (SHA-256 for both the digest and MGF1, no label) and base64 encoded. The password is never sent in the clear and there is no unencrypted alternative. An envelope that does not open is a 400 with code undecryptable_password, which means the key in use is not the one this datatracker holds - it is not a statement about the credentials, and is worth alerting on rather than showing the person.

        Matching on the identifier is case-insensitive, and it may be either the datatracker username or any of the Person's email addresses.

        Every credential failure is the same 400 with code verification_failed: an unknown address, a wrong password, a disabled account, an identifier that names two people and an account with no Person are not distinguished, so the response cannot be used to discover which addresses exist. It is not a 401 - the caller is authenticated, and what failed is the password it asked about. There is no lockout: repeated failures neither block the caller nor let one person deny another their enrollment.

        emails carries every address of the Person, including inactive ones - offer the active ones and treat the rest as claimable. already_linked true means the Person is already attached to an account and enrollment must stop and send them to normal login instead.

        The response is Person-scoped. It carries no datatracker username, no password material, and no database keys apart from legacy_sub, which is the subject the datatracker used to issue for this account and is needed only to keep existing relying parties working.
      summary: Validate datatracker credentials
      tags:
      - migration
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyRequestRequest'
        required: true
      security:
      - apiKeyAuth: []
      - cookieAuth: []
      responses:
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountMigrationVerifyErrorResponse400'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse404'
              examples:
                NotFound:
                  value:
                    type: client_error
                    errors:
                    - code: not_found
                      detail: Not found.
                      attr: null
          description: ''
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifyResponse'
          description: ''
