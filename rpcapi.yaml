      type: object
      properties:
        uuids:
          type: array
          items:
            type: string
            format: uuid
          maxItems: 500
      required:
      - uuids
    PersonUUIDBatchResponse:
      type: object
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/PersonUUIDBatchEntry'
      required:
      - results
    PersonUUIDResolution:
