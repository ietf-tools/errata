services:
  app:
    build:
      context: .
      dockerfile: docker/errata.Dockerfile
#      target: app-dev
    init: true
    command: sleep infinity
    depends_on:
      - db
    ipc: host
    environment:
      DISPLAY: host.docker.internal:0
    user: notroot
    volumes:
      - .:/workspace
    ports:
      - "8808:8808"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  db:
    build:
      context: .
      dockerfile: docker/db.Dockerfile
    restart: unless-stopped
    volumes:
      - errata_data:/var/lib/postgresql/data

  celery:
    image: "${COMPOSE_PROJECT_NAME}-app"
    command: [ "/celery-init.sh" ]  # without beat
#    command: [ "/celery-init.sh", "-BE" ]  # with beat
    depends_on:
      db:
        condition: service_started
      mq:
        condition: service_started
      blobstore-init:
        condition: service_completed_successfully
    volumes:
      - .:/workspace
    extra_hosts:
      - "host.docker.internal:host-gateway"

  mq:
    image: rabbitmq:4.2-management

  mailpit:
    image: axllent/mailpit:v1.27
    environment:
      - MP_DISABLE_VERSION_CHECK=true
      - MP_LABEL=ErrataMail
    ports:
      - "8825:8025"

  blobstore:
    image: chrislusf/seaweedfs:4.48
    # image entrypoint adds -dir=/data -volume.max=0 -master.volumeSizeLimitMB=1024
    command:
      - server
      - -ip=blobstore
      - -ip.bind=0.0.0.0
      - -s3
      - -s3.port=9000
      - -s3.config=/etc/seaweedfs/s3.json
    volumes:
      - seaweed_data:/data
      - ./docker/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    ports:
      - "9002:8888" # filer UI; dodge datatracker's use of 9001
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/healthz"]
      interval: 5s
      timeout: 3s
      retries: 20

  blobstore-init:
    image: chrislusf/seaweedfs:4.48
    depends_on:
      blobstore:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    # keep the bucket list in sync with STORAGE_BUCKETS in settings/base.py
    command:
      - |
        weed_shell () { echo "$$1" | timeout 20 weed shell -master=blobstore:9333 -filer=blobstore:8888; }
        for bucket in red; do
          # retry: s3 /healthz can come up before the filer is ready
          tries=0
          until weed_shell s3.bucket.list | grep -qw "$$bucket"; do
            tries=$$((tries + 1))
            if [ "$$tries" -gt 30 ]; then
              echo "Failed to create bucket $$bucket"
              exit 1
            fi
            weed_shell "s3.bucket.create -name $$bucket" || true
            sleep 2
          done
          echo "Bucket $$bucket ready"
        done
    restart: "no"

volumes:
  errata_data:
  seaweed_data:
